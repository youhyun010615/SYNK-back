server:
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:synk-videos}
    region: ${AWS_REGION:ap-northeast-2}
  lambda:
    function-name: ${AWS_LAMBDA_COLLAGE_FUNCTION:synk-collage}
    synklog-function-name: ${AWS_LAMBDA_SYNKLOG_FUNCTION:synk-synklog}
    region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

collage:
  callback:
    secret: ${COLLAGE_CALLBACK_SECRET}
  callback-url: ${COLLAGE_CALLBACK_URL:https://api.synk.ai.kr/api/collages/callback}

synklog:
  callback-url: ${SYNKLOG_CALLBACK_URL:https://api.synk.ai.kr/api/synklogs/callback}
