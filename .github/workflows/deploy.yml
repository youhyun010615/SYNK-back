name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
    # 서버 코드와 무관한 변경(문서, Lambda, 이슈/PR 템플릿)만 있는 push 는 배포(서버 재시작)를 건너뛴다.
    # 변경 파일 중 하나라도 아래 경로 밖이면 평소처럼 배포된다.
    # (Lambda 는 이 워크플로가 아니라 별도로 직접 배포한다)
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'lambda/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # 필요할 때 Actions 탭에서 수동으로 배포
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/synk

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > src/main/resources/firebase-service-account.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_LAMBDA_COLLAGE_FUNCTION: ${{ secrets.AWS_LAMBDA_COLLAGE_FUNCTION }}
      COLLAGE_CALLBACK_SECRET: ${{ secrets.COLLAGE_CALLBACK_SECRET }}
      COLLAGE_CALLBACK_URL: ${{ secrets.COLLAGE_CALLBACK_URL }}
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,JWT_SECRET,JWT_EXPIRATION,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,AWS_ACCESS_KEY,AWS_SECRET_KEY,AWS_LAMBDA_COLLAGE_FUNCTION,COLLAGE_CALLBACK_SECRET,COLLAGE_CALLBACK_URL
          script: |
            cat > ~/synk.env << EOF
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRATION=$JWT_EXPIRATION
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            AWS_ACCESS_KEY=$AWS_ACCESS_KEY
            AWS_SECRET_KEY=$AWS_SECRET_KEY
            AWS_LAMBDA_COLLAGE_FUNCTION=$AWS_LAMBDA_COLLAGE_FUNCTION
            COLLAGE_CALLBACK_SECRET=$COLLAGE_CALLBACK_SECRET
            COLLAGE_CALLBACK_URL=$COLLAGE_CALLBACK_URL
            JAVA_TOOL_OPTIONS=-Xmx448m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
            EOF

            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop synk || true
            docker rm synk || true
            docker run -d \
              --name synk \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file ~/synk.env \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
